[package]
name = "ve_dash"
description = "btop-style dashboard building blocks: titled panels, sparklines, meters, status dots, stat tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["fonts"]
# Embed IBM Plex Sans / Plex Mono (the vhrd_brand faces, OFL) and expose `install_fonts`.
fonts = []

[dependencies]
egui.workspace = true

[dev-dependencies]
eframe = { workspace = true, features = ["wgpu"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
