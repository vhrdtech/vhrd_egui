[package]
name = "ve_dash"
description = "btop-style dashboard building blocks: sparklines, meters, status dots, stat tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["fonts"]
# The brand faces now live in ve_theme; this keeps the deprecated `install_fonts` re-export working.
fonts = ["ve_theme/fonts"]

[dependencies]
egui.workspace = true
ve_theme = { path = "../ve_theme", version = "0.27", default-features = false }
web-time.workspace = true

[dev-dependencies]
eframe = { workspace = true, features = ["wgpu"] }
# the frame the demo and the snapshot put the blocks in; ve_frame depends on ve_dash, a dev-dependency cycle is fine
ve_frame = { path = "../ve_frame", version = "0.27" }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
