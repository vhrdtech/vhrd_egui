[package]
name = "ve_dash"
description = "btop-style dashboard building blocks: titled panels, sparklines, meters, status dots, stat tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["fonts"]
# The brand faces now live in ve_theme; this keeps the deprecated `install_fonts` re-export working.
fonts = ["ve_theme/fonts"]

[dependencies]
egui.workspace = true
ve_theme = { path = "../ve_theme", version = "0.9.1", default-features = false }

[dev-dependencies]
eframe = { workspace = true, features = ["wgpu"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
