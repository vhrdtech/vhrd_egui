# This is a web crate (PLT-9): calls here must not panic on wasm32-unknown-unknown, which has no clock, threads,
# filesystem or process. disallowed-methods has no module wildcard, so std::fs is enumerated by hand.
disallowed-methods = [
    "std::time::Instant::now",
    "std::time::SystemTime::now",
    "std::thread::spawn",
    "std::thread::sleep",
    "std::process::Command::new",
    "std::fs::read",
    "std::fs::read_to_string",
    "std::fs::write",
    "std::fs::File::open",
    "std::fs::File::create",
    "std::fs::create_dir",
    "std::fs::create_dir_all",
    "std::fs::remove_file",
    "std::fs::remove_dir",
    "std::fs::remove_dir_all",
    "std::fs::rename",
    "std::fs::copy",
    "std::fs::hard_link",
    "std::fs::metadata",
    "std::fs::symlink_metadata",
    "std::fs::read_dir",
    "std::fs::canonicalize",
    "std::fs::set_permissions",
]
