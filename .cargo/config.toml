[env]
# The snapshot tests draw the same picture on every PC (FRM-19): egui_kittest takes a CPU rasteriser when wgpu
# offers one (lavapipe where it is installed, as on one of our dev PCs), and this makes Mesa offer its own
# (llvmpipe, through GL) on a PC without lavapipe (another of our dev PCs has only RADV). A real GPU
# antialiases edges a level or two differently, past the snapshot threshold on a few hundred pixels. Only
# software GL is switched: the example windows paint through wgpu on Vulkan and are not touched. The same fix
# as used in the mesh dashboard app.
LIBGL_ALWAYS_SOFTWARE = "1"
