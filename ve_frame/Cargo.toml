[package]
name = "ve_frame"
description = "The frame every vhrd egui widget sits in: header with LED, info, size switch and menu, footer, sides, moves between grid, window, OS window and machine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
egui.workspace = true
serde.workspace = true
# notices: a red frame out of view sends rings across the backdrop (FRM-16); the CPU side only, no wgpu
ve_backdrop = { path = "../ve_backdrop", version = "0.31", default-features = false }
ve_dash = { path = "../ve_dash", version = "0.31", default-features = false }
ve_theme = { path = "../ve_theme", version = "0.31", default-features = false }

[dev-dependencies]
eframe = { workspace = true, features = ["wgpu"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
image = { version = "0.25", default-features = false }
serde_json = "1"
# the background of the playground example, with the shader
ve_backdrop = { path = "../ve_backdrop", version = "0.31" }
ve_theme = { path = "../ve_theme", version = "0.31" }
