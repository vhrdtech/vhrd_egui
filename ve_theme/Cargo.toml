[package]
name = "ve_theme"
description = "VHRD design system for egui: brand tokens, dark and light styles, typography, UiExt helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["fonts", "icons"]
# Embed IBM Plex Sans / Plex Mono (the vhrd_brand faces, OFL) and install them in `setup`.
fonts = []
# The Phosphor regular icon font (CHR-7): installed with the brand fonts, its glyphs as `icons::ph`.
phosphor = ["fonts", "dep:egui-phosphor"]
# SVG icons with colour slots (CHR-7): `icons::SvgIcon`, rasterised by resvg into cached masks tinted at paint.
icons = ["phosphor", "dep:resvg"]
# `ColorSource` as a setting: "desktop", "brand" or "#rrggbb".
serde = ["dep:serde"]

[dependencies]
egui.workspace = true
serde = { workspace = true, optional = true }
log.workspace = true
resvg = { workspace = true, optional = true }
egui-phosphor = { workspace = true, optional = true }
# the gallery shows its helpers (fold_rest)
ve_basics = { path = "../ve_basics", version = "0.36" }

# build.rs reads the vhrd_brand export (brand/palette.json) into colour constants.
[build-dependencies]
serde_json = "1"

[[example]]
name = "gallery"
# The Icons page needs the SVG icons.
required-features = ["icons"]

[dev-dependencies]
eframe = { workspace = true, features = ["wgpu"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }

[lints]
workspace = true
