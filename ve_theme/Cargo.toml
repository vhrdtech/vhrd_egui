[package]
name = "ve_theme"
description = "VHRD design system for egui: brand tokens, dark and light styles, typography, UiExt helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["fonts"]
# Embed IBM Plex Sans / Plex Mono (the vhrd_brand faces, OFL) and install them in `setup`.
fonts = []

[dependencies]
egui.workspace = true
# the gallery shows its helpers (fold_rest)
ve_basics = { path = "../ve_basics", version = "0.32" }

# build.rs reads the vhrd_brand export (brand/palette.json) into colour constants.
[build-dependencies]
serde_json = "1"

[dev-dependencies]
eframe = { workspace = true, features = ["wgpu"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
