[package]
name = "ve_backdrop"
description = "Animated app background for egui: a grid of dots or squares that reacts to the pointer and to widget frames, as a wgpu shader with a CPU-painted fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["wgpu"]
# The shader path: an egui_wgpu paint callback. Without it (glow, wasm without WebGPU) only the CPU painter exists.
wgpu = ["dep:egui-wgpu", "dep:bytemuck"]
# Serialize `Settings` (persisted app settings).
serde = ["dep:serde"]

[dependencies]
egui.workspace = true
ve_theme = { path = "../ve_theme", version = "0.18", default-features = false }
egui-wgpu = { workspace = true, optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
eframe = { workspace = true, features = ["wgpu"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
ve_theme = { path = "../ve_theme", version = "0.18" }
egui-wgpu.workspace = true
image = { version = "0.25", default-features = false }
