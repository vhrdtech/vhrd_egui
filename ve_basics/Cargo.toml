[package]
name = "ve_basics"
description = "Small egui basics every vhrd app wants: build info, non-selectable labels, hover cross-reference highlight"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
egui.workspace = true
web-time.workspace = true
# pure-Rust PNG decode for load_icon (BAS-9), the same on native and the web
image = { version = "0.25", default-features = false, features = ["png"] }
# actions register themselves where they are declared (CHR-1)
inventory.workspace = true
# the keymap file, with spans for file:line problems (CHR-1)
toml = { workspace = true, features = ["std", "parse"] }
ve_alloc_count = { path = "../ve_alloc_count", version = "0.34", optional = true }

[features]
# perf records allocations per frame (alloc.count, alloc.bytes) when the app installs ve_alloc_count::CountingAlloc
alloc-count = ["dep:ve_alloc_count"]
# perf::ManualClock, a clock tests move by hand
test-support = []

[dev-dependencies]
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
