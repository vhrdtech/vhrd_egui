[package]
name = "ve_basics"
description = "Small egui basics every vhrd app wants: build info, non-selectable labels, hover cross-reference highlight"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
egui.workspace = true
web-time.workspace = true
# pure-Rust PNG decode for load_icon (BAS-9), the same on native and the web
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
