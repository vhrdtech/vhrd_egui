[package]
name = "ve_app"
description = "Application shell for vhrd egui apps: menu bar, tiles of ve_widget widgets, about / settings / debug windows, persisted layout"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
egui.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui_tiles.workspace = true
inventory.workspace = true
log.workspace = true
serde.workspace = true
serde_json = "1"
typetag.workspace = true
ve_basics = { path = "../ve_basics", version = "0.13" }
ve_theme = { path = "../ve_theme", version = "0.13" }
ve_widget = { path = "../ve_widget", version = "0.13" }

[dev-dependencies]
eframe = { workspace = true, features = ["persistence", "wgpu"] }
egui_kittest = { workspace = true, features = ["eframe", "snapshot", "wgpu"] }
