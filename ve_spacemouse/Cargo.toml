[package]
name = "ve_spacemouse"
description = "3D mouse input for egui apps through spacenavd: a pure-Rust client of its socket, axis mapping with a guided calibration, and a pie menu on the device's buttons"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["icons"]
# Phosphor icons for the pie menu's slots: the `icons` module, ve_theme's Phosphor regular set, whose font
# `ve_theme::setup` installs.
icons = ["ve_theme/phosphor"]

[dependencies]
egui.workspace = true
serde.workspace = true
log.workspace = true
ve_theme = { path = "../ve_theme", version = "0.35", default-features = false }
# spacemouse.toml: the shared settings files (SPM-5)
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }

[[example]]
name = "demo"
# The demo's pie menu shows Phosphor icons.
required-features = ["icons"]

[dev-dependencies]
tempfile = "3"
eframe = { workspace = true, features = ["persistence", "wgpu"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
ve_theme = { path = "../ve_theme", version = "0.35" }

[lints]
workspace = true
