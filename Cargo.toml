[workspace.package]
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vhrdtech/vhrd_egui"
version = "0.1.0"

[workspace]
resolver = "3"
members = ["ve_macro",
    "ve_widget",
]

[workspace.dependencies]
egui = "0.35"
eframe = "0.35"
erased-serde = "0.4"
typetag = "0.2"
inventory = "0.3"
tokio = { version = "1", features = ["sync"] }
