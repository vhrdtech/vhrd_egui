[workspace.package]
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vhrdtech/vhrd_egui"
version = "0.38.0"
rust-version = "1.88"

[workspace]
resolver = "3"
members = [
    "ve_macro",
    "ve_widget",
    "ve_dash",
    "ve_frame",
    "ve_settle",
    "ve_alloc_count",
    "ve_basics",
    "ve_basics_benchmarks",
    "ve_theme_benchmarks",
    "ve_theme",
    "ve_backdrop",
    "ve_phosphor",
    "ve_template",
    "ve_app",
    "ve_spacemouse",
    "ve_view3d",
]

# Crates that opt in with `[lints] workspace = true`; ve_alloc_count holds the only unsafe code, with its own table.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
egui = "0.36"
eframe = "0.36"
egui_kittest = "0.36"
egui-wgpu = { version = "0.36", default-features = false }
egui_tiles = "0.17"
log = "0.4"
serde = { version = "1", features = ["derive"] }
erased-serde = "0.4"
typetag = "0.2"
inventory = "0.3"
tokio = { version = "1", features = ["sync"] }
web-time = "1"
toml = { version = "1", default-features = false }
# ve_theme icons (CHR-7): SVG to coverage masks, no text, no system fonts, no raster images.
resvg = { version = "0.45", default-features = false }
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }

# Debug builds with many widgets were slow: our code a little optimised and still debuggable, the dependencies
# (egui, wgpu, ...) near release speed. Tests use it too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# just install: release, but incremental so a rebuild after a small change is quick
[profile.deploy]
inherits = "release"
incremental = true
